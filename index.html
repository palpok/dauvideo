<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Text Grid</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1b;--card:#fff;--bd:#d9d9d4;--ac:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#eeeeea;--card:#222220;--bd:#3a3a37;--ac:#ff8a4c}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:12px;max-width:1000px;margin-inline:auto}
h1{font-size:18px;margin:0 0 10px}
.wrap{position:relative;background:#000;border-radius:8px;overflow:hidden}
video{display:block;width:100%;height:auto;min-height:180px}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.s{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.s output{text-align:right;font-variant-numeric:tabular-nums;opacity:.8}
input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input[type=text]{min-width:0;flex:1}
input[type=range]{width:100%;padding:0;accent-color:var(--ac)}
input[type=color]{padding:0;width:36px;height:30px}
button{cursor:pointer}
label{display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<h1>Video Text Grid</h1>

<div class="row" style="margin-bottom:8px">
  <input type="file" id="file" accept="video/*,image/*">
  <input type="text" id="url" placeholder="hoặc dán link video/ảnh">
  <button id="load">Tải</button>
  <button id="demo">Nền thử</button>
</div>

<div class="wrap" id="wrap">
  <img id="im" alt="" style="display:none;width:100%;height:auto">
  <video id="v" playsinline preload="metadata" loop></video>
  <canvas id="c"></canvas>
</div>

<div class="card row" id="ctl">
  <button id="pp">▶</button>
  <input type="range" id="seek" min="0" max="1000" value="0" style="flex:1">
  <span id="time">0:00</span>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="txt" value="MARKER" placeholder="Nhập text">
    <input type="color" id="col" value="#ffffff">
    <label><input type="checkbox" id="stag"> So le</label>
    <label><input type="checkbox" id="grid"> Viền ô</label>
  </div>
  <div id="sl"></div>
</div>

<div class="card">
  <div class="row">
    <button id="png">Tải ảnh PNG</button>
    <button id="rend">Render video & tải về</button>
    <label><input type="checkbox" id="aud" checked> Giữ âm thanh</label>
    <select id="mode"><option value="rt">Thời gian thực</option><option value="w1">WebCodecs x1</option><option value="w2">WebCodecs x2</option><option value="w4">WebCodecs x4</option><option value="w8">WebCodecs x8</option></select>
    <progress id="prog" max="1" value="0" style="flex:1;min-width:80px"></progress>
  </div>
  <small id="msg" style="opacity:.7;display:block;margin-top:6px">Render chạy theo thời gian thực: giữ tab ở phía trước và đợi đến khi xong. Âm thanh vẫn phát ra trong lúc render.</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const v=$('v'),c=$('c'),ctx=c.getContext('2d');

const S=[
  ['cols','Số cột',1,30,5,1],
  ['rows','Số hàng',1,30,3,1],
  ['ang','Xoay chữ°',-180,180,0,1],
  ['gang','Xoay lưới°',-180,180,0,1],
  ['size','Cỡ chữ %',1,30,6,0.5],
  ['op','Độ mờ %',5,100,70,5]
];
const P={};
$('sl').innerHTML=S.map(([k,l,mn,mx,d,st])=>
  `<div class="s"><span>${l}</span><input type="range" id="${k}" min="${mn}" max="${mx}" step="${st}" value="${d}"><output id="o_${k}">${d}</output></div>`).join('');
const KEY='vtg-v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){for(const k in s){const e=$(k);if(!e)continue;e.type==='checkbox'?e.checked=s[k]:e.value=s[k]}}}catch(e){}

function read(){
  S.forEach(([k])=>{P[k]=+$(k).value;$('o_'+k).textContent=$(k).value});
  P.txt=$('txt').value;P.col=$('col').value;P.stag=$('stag').checked;P.grid=$('grid').checked;
  try{localStorage.setItem(KEY,JSON.stringify({...Object.fromEntries(S.map(([k])=>[k,$(k).value])),txt:P.txt,col:P.col,stag:P.stag,grid:P.grid}))}catch(e){}
  draw();
}

function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;draw()}
new ResizeObserver(resize).observe($('wrap'));

function draw(g,W,H){
  const ctx=g||c.getContext('2d');W=W||c.width;H=H||c.height;
  if(!g)ctx.clearRect(0,0,W,H);
  if(!P.txt&&!P.grid)return;
  const cw=W/P.cols,ch=H/P.rows,fs=H*P.size/100;
  ctx.save();
  ctx.translate(W/2,H/2);ctx.rotate(P.gang*Math.PI/180);ctx.translate(-W/2,-H/2);
  ctx.globalAlpha=P.op/100;
  ctx.font='bold '+fs+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=P.col;ctx.strokeStyle=P.col;ctx.lineWidth=Math.max(1,W/600);
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=fs*.15;
  const t=P.gang*Math.PI/180,ca=Math.abs(Math.cos(t)),sa=Math.abs(Math.sin(t));
  const ex=Math.ceil((W*ca+H*sa-W)/2/cw)+1,ey=Math.ceil((W*sa+H*ca-H)/2/ch)+1;
  for(let j=-ey;j<P.rows+ey;j++){
    const off=(P.stag&&((j%2)+2)%2)?cw/2:0;
    for(let i=-ex;i<P.cols+ex;i++){
      const x=off?i*cw:(i+.5)*cw,y=(j+.5)*ch;
      if(P.grid)ctx.strokeRect(x-cw/2,j*ch,cw,ch);
      ctx.save();ctx.translate(x,y);ctx.rotate(P.ang*Math.PI/180);
      ctx.fillText(P.txt,0,0);ctx.restore();
    }
  }
  ctx.restore();
}

document.querySelectorAll('#sl input,#txt,#col,#stag,#grid').forEach(e=>e.addEventListener('input',read));

const fmt=t=>{t=t||0;return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
$('pp').onclick=()=>v.paused?v.play():v.pause();
v.onplay=()=>$('pp').textContent='⏸';v.onpause=()=>$('pp').textContent='▶';
$('seek').oninput=e=>{if(v.duration)v.currentTime=v.duration*e.target.value/1000};
v.ontimeupdate=()=>{$('time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);if(v.duration)$('seek').value=v.currentTime/v.duration*1000};
const im=$('im');
im.onload=resize;
function showImg(src){v.pause();v.style.display='none';im.src=src;im.style.display='block';$('ctl').style.display='none'}
function showVid(src){im.style.display='none';v.style.display='block';$('ctl').style.display='flex';v.src=src;v.load()}
const isImg=(t,n)=>(t||'').startsWith('image/')||/\.(png|jpe?g|gif|webp|avif|svg)(\?|$)/i.test(n||'');
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);isImg(f.type,f.name)?showImg(u):showVid(u)};
$('load').onclick=()=>{const u=$('url').value.trim();if(u)isImg('',u)?showImg(u):showVid(u)};
$('demo').onclick=()=>{
  const k=document.createElement('canvas');k.width=1280;k.height=720;const g=k.getContext('2d');
  const gr=g.createLinearGradient(0,0,1280,720);gr.addColorStop(0,'#1e3c72');gr.addColorStop(.5,'#2a9d8f');gr.addColorStop(1,'#e9c46a');
  g.fillStyle=gr;g.fillRect(0,0,1280,720);showImg(k.toDataURL('image/png'));
};
const sv=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const msg=t=>$('msg').textContent=t;
$('png').onclick=()=>{
  let src,w,h;
  if(im.style.display!=='none'&&im.naturalWidth){src=im;w=im.naturalWidth;h=im.naturalHeight}
  else if(v.videoWidth){src=v;w=v.videoWidth;h=v.videoHeight}
  else return msg('Chưa có ảnh hoặc video.');
  try{
    const k=document.createElement('canvas');k.width=w;k.height=h;const g=k.getContext('2d');
    g.drawImage(src,0,0,w,h);draw(g,w,h);
    k.toBlob(b=>b?sv(b,'stamped.png'):msg('Không xuất được ảnh.'),'image/png');
  }catch(e){msg('Không xuất được: nguồn ảnh/video bị chặn CORS. Hãy chọn file từ máy.')}
};
let rec=null;
$('rend').onclick=async()=>{
  if(rec){rec.stop();return}
  if(v.style.display==='none'||!v.videoWidth)return msg('Hãy chọn video trước.');
  if($('mode').value!=='rt')return fast(+$('mode').value.slice(1));
  if(!window.MediaRecorder)return msg('Trình duyệt này không hỗ trợ MediaRecorder.');
  const w=v.videoWidth&~1,h=v.videoHeight&~1;
  const k=document.createElement('canvas');k.width=w;k.height=h;const g=k.getContext('2d');
  let out;
  try{out=k.captureStream(30)}catch(e){return msg('Trình duyệt không hỗ trợ captureStream.')}
  if($('aud').checked){try{const as=v.captureStream?v.captureStream():null;if(as)as.getAudioTracks().forEach(t=>out.addTrack(t))}catch(e){}}
  const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const loopWas=v.loop,chunks=[];let run=true;
  try{rec=new MediaRecorder(out,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6})}catch(e){rec=null;return msg('Không tạo được bộ ghi video.')}
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    run=false;v.pause();v.loop=loopWas;v.onended=null;rec=null;
    $('rend').textContent='Render video & tải về';$('prog').value=0;
    const type=(chunks[0]&&chunks[0].type)||mt||'video/webm';
    sv(new Blob(chunks,{type}),'stamped.'+(type.includes('mp4')?'mp4':'webm'));
    msg('Xong. Đã tải file về.');
  };
  v.loop=false;v.pause();v.currentTime=0;
  const frame=()=>{if(!run)return;g.drawImage(v,0,0,w,h);draw(g,w,h);if(v.duration)$('prog').value=v.currentTime/v.duration;requestAnimationFrame(frame)};
  v.onended=()=>{if(rec)rec.stop()};
  rec.start(500);
  $('rend').textContent='Dừng & lưu';msg('Đang render...');
  try{await v.play()}catch(e){rec.stop();return}
  frame();
};
const WC=!!(window.VideoEncoder&&window.Mp4Muxer&&window.VideoFrame);
if(!WC)[...$('mode').options].forEach(o=>{if(o.value!=='rt')o.disabled=true});
$('mode').value=WC?'w4':'rt';
$('mode').onchange=()=>msg($('mode').value==='rt'?'Thời gian thực: video dài bao nhiêu thì render bấy nhiêu, giữ tab ở phía trước.':'WebCodecs: nhanh hơn thời gian thực, xuất mp4, không cần nghe tiếng. x càng cao càng dễ rớt khung.');
$('mode').onchange();

async function fast(sp){
  if(!WC)return msg('Trình duyệt không hỗ trợ WebCodecs.');
  if(!v.requestVideoFrameCallback)return msg('Trình duyệt thiếu requestVideoFrameCallback.');
  const w=v.videoWidth&~1,h=v.videoHeight&~1;
  const k=document.createElement('canvas');k.width=w;k.height=h;const g=k.getContext('2d');
  let cfg=null;
  for(const codec of ['avc1.640033','avc1.640028','avc1.42001f']){
    const c0={codec,width:w,height:h,bitrate:8e6,framerate:30};
    try{if((await VideoEncoder.isConfigSupported(c0)).supported){cfg=c0;break}}catch(e){}
  }
  if(!cfg)return msg('Không có bộ mã hóa H.264 phù hợp.');
  let ab=null,ac=null,nch=0;
  if($('aud').checked){
    try{
      ab=await new AudioContext().decodeAudioData(await (await fetch(v.currentSrc)).arrayBuffer());
      nch=Math.min(2,ab.numberOfChannels);
      ac={codec:'mp4a.40.2',sampleRate:ab.sampleRate,numberOfChannels:nch,bitrate:128000};
      if(!(await AudioEncoder.isConfigSupported(ac)).supported)throw 0;
    }catch(e){ab=null;ac=null}
  }
  const target=new Mp4Muxer.ArrayBufferTarget();
  const mux=new Mp4Muxer.Muxer({target,fastStart:'in-memory',video:{codec:'avc',width:w,height:h},...(ab?{audio:{codec:'aac',numberOfChannels:nch,sampleRate:ab.sampleRate}}:{})});
  const ve=new VideoEncoder({output:(ch,m)=>mux.addVideoChunk(ch,m),error:e=>msg('Lỗi mã hóa: '+e.message)});
  ve.configure(cfg);
  let ae=null;
  if(ab){
    ae=new AudioEncoder({output:(ch,m)=>mux.addAudioChunk(ch,m),error:console.error});ae.configure(ac);
    const N=ab.length,sr=ab.sampleRate;
    for(let o=0;o<N;o+=sr){
      const n=Math.min(sr,N-o),d=new Float32Array(n*nch);
      for(let q=0;q<nch;q++)d.set(ab.getChannelData(q).subarray(o,o+n),q*n);
      const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:nch,timestamp:Math.round(o/sr*1e6),data:d});
      ae.encode(ad);ad.close();
    }
  } else if($('aud').checked) msg('Không xử lý được âm thanh, sẽ xuất video không tiếng.');
  const was={loop:v.loop,muted:v.muted,rate:v.playbackRate};
  v.loop=false;v.muted=true;v.pause();v.currentTime=0;
  let run=true,last=-1,n=0;const t0=performance.now();
  const finish=async()=>{
    if(!run)return;run=false;
    v.pause();v.onended=null;v.loop=was.loop;v.muted=was.muted;v.playbackRate=was.rate;
    msg('Đang hoàn tất file...');
    try{
      await ve.flush();if(ae)await ae.flush();mux.finalize();
      sv(new Blob([target.buffer],{type:'video/mp4'}),'stamped.mp4');
      msg('Xong trong '+((performance.now()-t0)/1000).toFixed(0)+' giây. Đã tải file về.');
    }catch(e){msg('Lỗi khi ghép file: '+e.message)}
    rec=null;$('rend').textContent='Render video & tải về';$('prog').value=0;
  };
  rec={stop:finish};
  const onf=(now,meta)=>{
    if(!run)return;
    if(meta.mediaTime>last){
      last=meta.mediaTime;
      g.drawImage(v,0,0,w,h);draw(g,w,h);
      const vf=new VideoFrame(k,{timestamp:Math.round(meta.mediaTime*1e6)});
      ve.encode(vf,{keyFrame:n++%90===0});vf.close();
      if(v.duration)$('prog').value=meta.mediaTime/v.duration;
      if(ve.encodeQueueSize>8)v.pause();
    }
    v.requestVideoFrameCallback(onf);
  };
  ve.addEventListener('dequeue',()=>{if(run&&v.paused&&!v.ended&&ve.encodeQueueSize<3)v.play().catch(()=>{})});
  v.onended=finish;
  v.playbackRate=sp;
  $('rend').textContent='Dừng & lưu';msg('Đang render x'+sp+'...');
  try{await v.play()}catch(e){await finish();return}
  v.requestVideoFrameCallback(onf);
}
read();
</script>
</body>
</html>
